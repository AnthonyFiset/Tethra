[package]
name = "tethra"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tethra desktop SSH client"
publish = false

[lib]
name = "tethra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tethra"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true }
serde = { version = "1", features = ["derive"] }
ssh-client-core = { package = "core", path = "../../../crates/core", features = ["sync-http"] }
platform = { workspace = true }
platform-desktop = { path = "../../../crates/platform-desktop" }
tauri = { version = "2.11", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"
ts-rs = "12"
uuid = { workspace = true }
serde_json = "1"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-decoration = "2.1.4"
# Pin to Tauri's window-vibrancy (0.6) — a second major version duplicates
# NSVisualEffectViewTagged ObjC symbols at link time.
window-vibrancy = "=0.6.0"
tauri-plugin-clipboard-manager = "2"

[target."cfg(windows)".dependencies]
windows-version = "0.1"
winreg = "0.55"
