[package]
name = "core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Portable SSH/SFTP client core. Must never depend on Tauri."
publish = false

[lib]
name = "ssh_client_core"
path = "src/lib.rs"

[[example]]
name = "ssh-client"
path = "examples/ssh-client.rs"
required-features = ["cli"]

[features]
default = []
cli = ["dep:clap", "dep:crossterm", "dep:rpassword", "dep:tracing-subscriber", "tokio/io-std", "tokio/signal"]
sync-http = ["dep:reqwest"]

[dependencies]
argon2 = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chacha20poly1305 = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
hkdf = { workspace = true }
platform = { workspace = true }
rand = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }
rusqlite = { workspace = true }
russh = { workspace = true }
russh-sftp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

# CLI harness only
clap = { version = "4", features = ["derive"], optional = true }
crossterm = { version = "0.29", optional = true }
rpassword = { version = "7", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
russh-config = "0.58.0"

[dev-dependencies]
async-trait = { workspace = true }
platform-desktop = { path = "../platform-desktop" }
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "process", "io-std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
