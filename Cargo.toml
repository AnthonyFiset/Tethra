[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/platform",
    "crates/platform-desktop",
    "crates/platform-ios",
    "crates/sync-server",
    "apps/tauri/src-tauri",
]
default-members = ["crates/core"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.2.0"

[workspace.dependencies]
argon2 = "0.5"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
hex = "0.4"
hkdf = "0.12"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
russh = "0.62"
russh-sftp = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "time", "net", "fs"] }
tracing = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }
zeroize = { version = "1", features = ["derive"] }
platform = { path = "crates/platform" }
