name: Sync server image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/sync-server/**"
      - "crates/core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/sync-server-image.yml"

permissions:
  contents: read

jobs:
  build:
    name: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        id: login
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Skip notice when ACR secrets are absent
        if: steps.login.outcome != 'success'
        run: |
          echo "::notice::ACR_LOGIN_SERVER / ACR_USERNAME / ACR_PASSWORD not set — building image only (no push). Forks stay green."

      - name: Image tags
        id: meta
        run: |
          sha=$(echo "${{ github.sha }}" | cut -c1-7)
          if [[ -n "${{ secrets.ACR_LOGIN_SERVER }}" ]]; then
            echo "tags=${{ secrets.ACR_LOGIN_SERVER }}/tethra-sync-server:latest,${{ secrets.ACR_LOGIN_SERVER }}/tethra-sync-server:${sha}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=tethra-sync-server:latest,tethra-sync-server:${sha}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (and push when logged in)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/sync-server/Dockerfile
          push: ${{ steps.login.outcome == 'success' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
