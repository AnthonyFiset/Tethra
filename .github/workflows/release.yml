name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

jobs:
  # Tag pushes used to race CI. Refuse to build installers until lint-test is green
  # on this exact commit (same checks as scripts/ci-check.sh).
  require-ci:
    name: require-ci
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI success on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          echo "Waiting for workflow CI to succeed on ${sha}"
          for _ in $(seq 1 90); do
            mapfile -t row < <(gh api \
              "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${sha}&per_page=5" \
              --jq '.workflow_runs[0] | [.status // "", .conclusion // "", .html_url // ""] | .[]')
            status="${row[0]:-}"
            conclusion="${row[1]:-}"
            url="${row[2]:-}"
            echo "CI status=${status:-none} conclusion=${conclusion:-none} ${url}"
            if [[ "$conclusion" == "success" ]]; then
              exit 0
            fi
            if [[ "$conclusion" == "failure" || "$conclusion" == "cancelled" || "$conclusion" == "timed_out" ]]; then
              echo "CI did not pass — refusing to release. Fix main, retag, or move the tag."
              exit 1
            fi
            sleep 20
          done
          echo "Timed out waiting for CI"
          exit 1

  publish:
    needs: require-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            rust_target: ""
            args: ""
          - platform: ubuntu-22.04
            rust_target: ""
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (with optional target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix apps/ui

      # Tag is the single source of truth for the shipped version.
      - name: Stamp version from tag
        run: node scripts/set-version.mjs ${{ github.ref_name }}

      # Windows Authenticode via Azure Artifact Signing (Approach A: Tauri
      # signCommand). Signs the app .exe before packaging and the NSIS installer
      # after — both get SHA-256 + RFC 3161 timestamps. Uses artifact-signing-cli
      # (crates.io rename of trusted-signing-cli). Minisign updater keys are
      # untouched (TAURI_SIGNING_* below). Skip politely when secrets are absent
      # so forks stay green — same pattern as ACR / site deploy.
      - name: Configure Windows Authenticode
        id: win_sign
        if: runner.os == 'Windows'
        shell: bash
        env:
          AZURE_SIGNING_TENANT_ID: ${{ secrets.AZURE_SIGNING_TENANT_ID }}
          AZURE_SIGNING_CLIENT_ID: ${{ secrets.AZURE_SIGNING_CLIENT_ID }}
          AZURE_SIGNING_CLIENT_SECRET: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${AZURE_SIGNING_TENANT_ID}" || -z "${AZURE_SIGNING_CLIENT_ID}" || -z "${AZURE_SIGNING_CLIENT_SECRET}" ]]; then
            echo "::notice::AZURE_SIGNING_* secrets not set — Windows artifacts will be unsigned. Forks stay green."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          cargo install artifact-signing-cli --locked
          # Inject signCommand only for this job (never committed) so local
          # Windows builds without the CLI keep working.
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("apps/tauri/src-tauri/tauri.conf.json")
          data = json.loads(path.read_text())
          windows = data.setdefault("bundle", {}).setdefault("windows", {})
          windows["signCommand"] = (
              "artifact-signing-cli "
              "-e https://eus.codesigning.azure.net/ "
              "-a tethra-signing "
              "-c tethra-public-trust "
              "-d Tethra "
              "%1"
          )
          path.write_text(json.dumps(data, indent=2) + "\n")
          print("Injected bundle.windows.signCommand for Authenticode")
          PY

      # Builds + uploads to a draft release. A follow-up job publishes once every
      # matrix leg succeeds so `releases/latest` never points at a half-built set.
      - name: Build installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Mapped for artifact-signing-cli (never log these values).
          AZURE_TENANT_ID: ${{ secrets.AZURE_SIGNING_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_SIGNING_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}
        with:
          projectPath: apps/tauri/src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: Tethra ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          includeUpdaterJson: true

  # Auto-publish after all platform artifacts are on the draft (no manual click).
  publish-release:
    name: publish-release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Undraft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          gh release edit "$tag" --repo "${{ github.repository }}" --draft=false
          echo "Published ${tag}"
          curl -fsSL "https://github.com/${{ github.repository }}/releases/latest/download/latest.json" \
            | jq '{version, platforms: (.platforms | keys)}'

  # Optional sync-server binary for self-hosted vault sync (not used for updates).
  sync-server:
    name: publish-sync-server
    needs: require-ci
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stamp version from tag
        run: node scripts/set-version.mjs ${{ github.ref_name }}

      - name: Build sync server
        run: cargo build -p tethra-sync-server --release

      # Binary only — not signing material / secrets.
      - name: Upload sync-server binary
        uses: actions/upload-artifact@v4
        with:
          name: tethra-sync-server-linux-x86_64
          path: target/release/tethra-sync-server
