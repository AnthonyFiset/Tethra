name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only — no Intel Mac target.
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: windows-latest
            rust_target: ""
            args: ""
          - platform: ubuntu-22.04
            rust_target: ""
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (with optional target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix apps/ui

      # Tag is the single source of truth for the shipped version.
      - name: Stamp version from tag
        run: node scripts/set-version.mjs ${{ github.ref_name }}

      - name: Build installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/tauri/src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: Tethra ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.args }}
          includeUpdaterJson: true

  sync-server:
    name: publish-sync-server
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stamp version from tag
        run: node scripts/set-version.mjs ${{ github.ref_name }}

      - name: Build sync server
        run: cargo build -p tethra-sync-server --release

      - name: Upload sync-server binary
        uses: actions/upload-artifact@v4
        with:
          name: tethra-sync-server-linux-x86_64
          path: target/release/tethra-sync-server
